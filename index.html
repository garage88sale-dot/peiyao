<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配药计算器</title>
<meta name="theme-color" content="#2b70c9" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { padding: 18px; background: #f4f7f6; font-size: 19px; }
  .row-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .row-btn { display: flex; gap: 12px; margin-bottom: 16px; }
  .item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: nowrap; }
  .inp-name { font-size: 17px; padding: 14px; border: 1px solid #ddd; border-radius: 10px; width: 0; flex: 2.5; }
  .inp-dose { font-size: 17px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; width: 0; flex: 1; }
  .weight-text { min-width: 75px; text-align: right; color:#333; font-weight: 500; font-size:17px; }
  .total-line { font-size: 22px; margin:18px 0; color:#222; }
  #method { width: 100%; padding:16px; border:1px solid #ddd; border-radius:12px; font-size:19px; margin-bottom:22px; }
  .btn { flex:1; padding:16px; border:none; border-radius:12px; background:#2b70c9; color:#fff; font-size:19px; }
  .btn-danger { background:#e64949; }
  .btn-sm { width: 40px; height: 40px; padding: 0; border:none; border-radius: 8px; background:#e64949; color:#fff; font-size:18px; display:grid; place-items:center; }
  input.short { width: 100px; padding:14px; border:1px solid #ddd; border-radius:12px; font-size:19px; }
  .label-txt { margin:0 8px; font-size:19px; }
  .archive-panel { background:#fff; padding:16px; border-radius:12px; margin: 12px 0; box-shadow: 0 1px 4px #00000018; }
  .archive-item { display:flex; gap:8px; align-items:center; margin:10px 0; }
  .archive-item span { flex:1; font-size:18px; }
</style>
</head>
<body>

<div class="row-top">
  <input class="short" id="timesPerDay" type="number" value="0">
  <span class="label-txt">次</span>
  <input class="short" id="dayCount" type="number" value="0">
  <span class="label-txt">天</span>
</div>

<div id="list"></div>

<div class="row-btn">
  <button class="btn" onclick="addRow()">添加中药</button>
  <button class="btn btn-danger" onclick="clearAll()">清空药方</button>
</div>

<div class="total-line">总重量：<span id="totalWeight">0.00</span> g</div>

<input id="method" placeholder="服法">

<div id="archivePanel" class="archive-panel" style="display:none;">
  <div id="archiveList"></div>
</div>
<div class="row-btn">
  <button class="btn" onclick="toggleArchive()">载入存档</button>
  <button class="btn" onclick="savePrescription()">保存</button>
</div>
<div class="row-btn">
  <button class="btn" onclick="copyText()">复制单</button>
  <button class="btn" onclick="exportBackup()">导出备份</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">导入备份</button>
  <input type="file" id="importFile" accept=".json" hidden onchange="importBackup(this)" />
</div>

<script>
let archive = JSON.parse(localStorage.getItem('prescriptionArchive') || '[]');
let working = JSON.parse(localStorage.getItem('workingPrescription') || '{"list":[{"name":"","dose":""},{"name":"","dose":""},{"name":"","dose":""},{"name":"","dose":""},{"name":"","dose":""},"times":0,"days":0,"method":""}');
const $ = id => document.getElementById(id);
let archiveOpen = false;

function saveWorking() {
  working.list = JSON.parse(JSON.stringify(data));
  working.times = rawNum($('timesPerDay').value);
  working.days = rawNum($('dayCount').value);
  working.method = $('method').value;
  localStorage.setItem('workingPrescription', JSON.stringify(working));
}
function saveArchive() {
  localStorage.setItem('prescriptionArchive', JSON.stringify(archive));
}

function rawNum(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function getParams() {
  return {
    times: rawNum($('timesPerDay').value),
    days: rawNum($('dayCount').value)
  };
}

let data = [];

function goodNumber(v) {
  if (v === '' || v === '.') return true;
  return /^\d+(\.\d{0,2})?$/.test(v);
}
function doseVal(raw) {
  const n = parseFloat(raw);
  return isNaN(n) ? 0 : n;
}

function render() {
  $('list').innerHTML = '';
  const { times, days } = getParams();
  let sumTotal = 0;
  data.forEach((it, idx) => {
    const single = doseVal(it.dose);
    const total = single * times * days;
    sumTotal += total;
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <input class="inp-name" placeholder="药名" value="${it.name || ''}"
             oninput="updateName(${idx}, this.value)"
             onblur="render()" />
      <input class="inp-dose" placeholder="单次(g)" value="${it.dose ?? ''}"
             oninput="checkDose(${idx}, this)"
             onblur="render()" />
      <span class="weight-text">${total.toFixed(2)}g</span>
      <button class="btn-sm" onclick="del(${idx})">−</button>
    `;
    $('list').appendChild(div);
  });
  $('totalWeight').textContent = sumTotal.toFixed(2);
  saveWorking();
}

function updateName(idx, val) {
  data[idx].name = val;
}

function checkDose(idx, el) {
  const v = el.value;
  if (goodNumber(v)) {
    data[idx].dose = v;
  } else {
    el.value = data[idx].dose ?? '';
  }
}

function del(i) {
  data.splice(i, 1);
  render();
}
function clearAll() {
  if (confirm('确定清空药方？')) {
    data = [
      { name: '', dose: '' },
      { name: '', dose: '' },
      { name: '', dose: '' },
      { name: '', dose: '' },
      { name: '', dose: '' }
    ];
    $('timesPerDay').value = 0;
    $('dayCount').value = 0;
    render();
  }
}

function renderArchiveList() {
  const box = $('archiveList');
  if (!archive.length) {
    box.innerHTML = '<div style="text-align:center;padding:10px;color:#666;">暂无存档</div>';
    return;
  }
  box.innerHTML = '';
  archive.forEach((item, idx) => {
    const line = document.createElement('div');
    line.className = 'archive-item';
    line.innerHTML = `
      <span>${item.name}</span>
      <button class="btn-sm" style="background:#2b70c9;" onclick="loadArchive(${idx})">载入</button>
      <button class="btn-sm" style="background:#2b70c9;" onclick="renameArchive(${idx})">改名</button>
      <button class="btn-sm" onclick="delArchive(${idx})">−</button>
    `;
    box.appendChild(line);
  })
}

function toggleArchive() {
  archiveOpen = !archiveOpen;
  $('archivePanel').style.display = archiveOpen ? 'block' : 'none';
  if (archiveOpen) renderArchiveList();
}

function loadArchive(idx) {
  const s = archive[idx];
  $('timesPerDay').value = s.times ?? 0;
  $('dayCount').value = s.days ?? 0;
  $('method').value = s.method ?? '';
  data = Array.isArray(s.list) ? s.list : [
    { name: '', dose: '' },
    { name: '', dose: '' },
    { name: '', dose: '' },
    { name: '', dose: '' },
    { name: '', dose: '' }
  ];
  render();
  alert('✅ 已载入：' + s.name);
}

function delArchive(idx) {
  if (!confirm('确定删除这条存档？')) return;
  archive.splice(idx, 1);
  saveArchive();
  renderArchiveList();
}

function renameArchive(idx) {
  const old = archive[idx].name;
  const newName = prompt('修改存档名称：', old);
  if (newName && newName.trim()) {
    archive[idx].name = newName.trim();
    saveArchive();
    renderArchiveList();
  }
}

function addRow() {
  data.unshift({ name: '', dose: '' });
  render();
}

function copyText() {
  const { times, days } = getParams();
  const method = $('method').value.trim();
  let out = `每日 ${times.toFixed(2)} 次，共 ${days.toFixed(2)} 天\n\n`;
  let sumTotal = 0;
  data.forEach(it => {
    const single = doseVal(it.dose);
    const total = single * times * days;
    out += `${(it.name || '').trim() || '无名药'}，${single.toFixed(2)}g，${total.toFixed(2)}g\n`;
    sumTotal += total;
  })
  out += `\n总重：${sumTotal.toFixed(2)}g`;
  if (method) out += `\n服法：${method}`;
  navigator.clipboard.writeText(out);
  alert('✅ 已复制抓药单');
}

function savePrescription() {
  const name = prompt('输入此方名称：');
  if (!name || !name.trim()) return;
  const times = rawNum($('timesPerDay').value);
  const days = rawNum($('dayCount').value);
  const method = $('method').value;
  archive.push({
    name: name.trim(),
    times,
    days,
    method,
    list: JSON.parse(JSON.stringify(data))
  });
  saveArchive();
  alert('✅ 已保存：' + name.trim());
}

function exportBackup() {
  const payload = { archive, savedAt: new Date().toLocaleString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `药方备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!Array.isArray(obj.archive)) throw '格式错误';
      if (confirm('导入会覆盖全部存档，确定？')) {
        archive = obj.archive;
        saveArchive();
        renderArchiveList();
        alert('✅ 导入成功！');
      }
    } catch {
      alert('❌ 文件无效');
    }
  }
  reader.readAsText(file);
}

$('timesPerDay').value = working.times ?? 0;
$('dayCount').value = working.days ?? 0;
$('method').value = working.method ?? '';
data = Array.isArray(working.list) ? working.list : [
  { name: '', dose: '' },
  { name: '', dose: '' },
  { name: '', dose: '' },
  { name: '', dose: '' },
  { name: '', dose: '' }
];
render();
</script>
</body>
</html>
