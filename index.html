<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配药计算器</title>
<meta name="theme-color" content="#2b70c9" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { padding: 18px; background: #f4f7f6; font-size: 17px; }
  .row-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .row-btn { display: flex; gap: 12px; margin-bottom: 18px; }
  .item-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: nowrap; }
  .item-row input { flex: 1; }
  .weight-text { min-width: 70px; text-align: right; color:#333; font-weight: 500; }
  .total-line { font-size: 20px; margin:16px 0; color:#222; }
  #method { width: 100%; padding:14px; border:1px solid #ddd; border-radius:12px; font-size:17px; margin-bottom:18px; }
  .btn { flex:1; padding:14px; border:none; border-radius:12px; background:#2b70c9; color:#fff; font-size:17px; }
  .btn-sm { padding:8px 11px; font-size:15px; }
  .btn-danger { background:#e64949; }
  input.short { width: 90px; padding:12px; border:1px solid #ddd; border-radius:12px; font-size:17px; }
  .label-txt { margin:0 6px; }
</style>
</head>
<body>

<div class="row-top">
  <input class="short" id="timesPerDay" type="number" value="2">
  <span class="label-txt">次</span>
  <input class="short" id="dayCount" type="number" value="7">
  <span class="label-txt">天</span>
</div>

<div class="row-btn">
  <button class="btn" onclick="addRow()">添加中药</button>
  <button class="btn btn-danger" onclick="clearAll()">清空药方</button>
</div>

<div id="list"></div>

<div class="total-line">总重量：<span id="totalWeight">0.00</span> g</div>

<input id="method" placeholder="服法">

<div class="row-btn">
  <button class="btn" onclick="copyText()">复制单</button>
  <button class="btn" onclick="savePrescription()">保存</button>
</div>

<div class="row-btn">
  <button class="btn" onclick="exportBackup()">导出备份</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">导入备份</button>
  <input type="file" id="importFile" accept=".json" hidden onchange="importBackup(this)" />
</div>

<script>
let archive = JSON.parse(localStorage.getItem('prescriptionArchive') || '[]');
let working = JSON.parse(localStorage.getItem('workingPrescription') || '{"list":[],"times":2,"days":7,"method":""}');
const $ = id => document.getElementById(id);

function saveWorking() {
  working.list = JSON.parse(JSON.stringify(data));
  working.times = Number($('timesPerDay').value) || 1;
  working.days = Number($('dayCount').value) || 1;
  working.method = $('method').value;
  localStorage.setItem('workingPrescription', JSON.stringify(working));
}
function saveArchive() {
  localStorage.setItem('prescriptionArchive', JSON.stringify(archive));
}
function getParams() {
  return {
    times: Number($('timesPerDay').value) || 1,
    days: Number($('dayCount').value) || 1
  };
}

let data = [];
function render() {
  $('list').innerHTML = '';
  const { times, days } = getParams();
  let sumTotal = 0;
  data.forEach((it, idx) => {
    const single = Number(it.dose) || 0;
    const total = single * times * days;
    sumTotal += total;
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <input placeholder="药名" value="${it.name || ''}" onchange="update(${idx},'name',this.value)" />
      <input placeholder="单次(g)" value="${it.dose || ''}" oninput="update(${idx},'dose',Number(this.value));render()" />
      <span class="weight-text">${total.toFixed(2)}g</span>
      <button class="btn btn-sm btn-danger" onclick="del(${idx})">−</button>
    `;
    $('list').appendChild(div);
  });
  $('totalWeight').textContent = sumTotal.toFixed(2);
  saveWorking();
}

function addRow(){ data.push({name:'',dose:''}); render(); }
function update(i,k,v){ data[i][k]=v; render(); }
function del(i){ data.splice(i,1); render(); }
function clearAll(){
  if(confirm('确定清空药方？')){ data=[]; render(); }
}

function copyText() {
  const { times, days } = getParams();
  const method = $('method').value.trim();
  let out = `每日 ${times} 次，共 ${days} 天\n\n`;
  let sumTotal = 0;
  data.forEach(it=>{
    const single = Number(it.dose)||0;
    const total = single * times * days;
    if(it.name && total>0){
      out += `${it.name}，${single}g，${total}g\n`;
      sumTotal += total;
    }
  })
  out += `\n总重：${sumTotal.toFixed(2)}g`;
  if(method) out += `\n服法：${method}`;
  navigator.clipboard.writeText(out);
  alert('✅ 已复制抓药单');
}

function savePrescription(){
  const times = Number($('timesPerDay').value)||1;
  const days = Number($('dayCount').value)||1;
  const method = $('method').value;
  archive.push({ times, days, method, list: JSON.parse(JSON.stringify(data)) });
  saveArchive();
  alert('✅ 方子已存入存档，导出备份可以全部保存');
}

function exportBackup(){
  const payload = { archive, savedAt: new Date().toLocaleString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `药方备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      if(!Array.isArray(obj.archive)) throw '格式错误';
      if(confirm('导入会覆盖全部存档，确定？')){
        archive = obj.archive;
        saveArchive();
        alert('✅ 导入成功！现在载入需要我再加一个【载入存档】按钮吗？');
      }
    }catch{ alert('❌ 文件无效'); }
  }
  reader.readAsText(file);
}

$('timesPerDay').value = working.times ?? 2;
$('dayCount').value = working.days ?? 7;
$('method').value = working.method ?? '';
data = working.list ?? [];
render();
</script>
</body>
</html>
